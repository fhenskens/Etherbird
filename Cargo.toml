[package]
name = "etherbird"
version = "0.4.1"
edition = "2024"
description = "Stable async clients with connection recovery and session restoration"
license = "Apache-2.0"
repository = "https://github.com/fhenskens/etherbird"
documentation = "https://docs.rs/etherbird"
keywords = ["reconnect", "tokio", "connection", "supervision", "pool"]
categories = ["asynchronous", "network-programming"]
# Keep repository configuration and recorded measurements out of the crate.
exclude = [
    ".github/**",
    ".gitignore",
    ".gitattributes",
    "docs/benchmarks/*.csv",
    "docs/benchmarks/*.txt",
]

[features]
default = []
pool = []

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "behavior"
required-features = ["pool"]

[[bench]]
name = "pool_dispatch"
harness = false
required-features = ["pool"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
rumqttc = { version = "0.25.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tokio-serial = { version = "5.5", default-features = false }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }

[[example]]
name = "scheduling"
required-features = ["pool"]

[[example]]
name = "live_recovery"
required-features = ["pool"]

[[example]]
name = "serial_device"
required-features = ["pool"]

[[example]]
name = "mqtt_with_etherbird"
required-features = ["pool"]
